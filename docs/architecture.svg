<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="920" height="420" rx="16" fill="url(#bg)"/>
  <text x="460" y="42" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">How MuseBridge works</text>
  <text x="460" y="66" text-anchor="middle" fill="#8b949e" font-size="13">Your coding app talks to Muse as if it were Claude — Muse does the work and the steps stream back.</text>

  <!-- Card 1: coding app -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="180" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="130" y="150" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Your coding app</text>
    <text x="130" y="176" text-anchor="middle" fill="#58a6ff" font-size="13">OpenCode · ZadLoop</text>
    <text x="130" y="210" text-anchor="middle" fill="#8b949e" font-size="11">You type a request</text>
    <text x="130" y="228" text-anchor="middle" fill="#8b949e" font-size="11">and read the answer</text>
  </g>

  <!-- Card 2: bridge -->
  <g filter="url(#shadow)">
    <rect x="300" y="110" width="200" height="150" rx="12" fill="#1a1333" stroke="#7c3aed"/>
    <text x="400" y="150" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">MuseBridge</text>
    <text x="400" y="174" text-anchor="middle" fill="#c9a3ff" font-size="12">runs on your PC</text>
    <text x="400" y="202" text-anchor="middle" fill="#8b949e" font-size="11">Looks like the Claude API,</text>
    <text x="400" y="220" text-anchor="middle" fill="#8b949e" font-size="11">drives a real Muse browser</text>
    <text x="400" y="238" text-anchor="middle" fill="#8b949e" font-size="11">tab for you</text>
  </g>

  <!-- Card 3: muse -->
  <g filter="url(#shadow)">
    <rect x="580" y="110" width="180" height="150" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="670" y="150" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Muse (muse.ai)</text>
    <text x="670" y="174" text-anchor="middle" fill="#3fb950" font-size="12">your account</text>
    <text x="670" y="202" text-anchor="middle" fill="#8b949e" font-size="11">Reads, thinks, and acts</text>
    <text x="670" y="220" text-anchor="middle" fill="#8b949e" font-size="11">step by step</text>
  </g>

  <!-- Card 4: PC -->
  <g filter="url(#shadow)">
    <rect x="800" y="150" width="90" height="70" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="845" y="182" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700">Your PC</text>
    <text x="845" y="202" text-anchor="middle" fill="#8b949e" font-size="10">(optional)</text>
  </g>

  <!-- Arrows -->
  <line x1="222" y1="185" x2="296" y2="185" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="502" y1="185" x2="576" y2="185" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="762" y1="185" x2="796" y2="185" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Return path -->
  <path d="M670,262 L670,320 L400,320 L400,262" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="535" y="340" text-anchor="middle" fill="#3fb950" font-size="11">live steps + final answer stream back</text>

  <!-- Footer tags -->
  <g fill="#8b949e" font-size="11">
    <rect x="300" y="366" width="320" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="460" y="385" text-anchor="middle" fill="#c9a3ff">localhost only · no API bill · your own Muse plan</text>
  </g>
</svg>
