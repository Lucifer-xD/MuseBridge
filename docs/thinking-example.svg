<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Consolas, 'SF Mono', Menlo, monospace">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="760" height="470" rx="14" fill="#0d1117"/>

  <!-- window chrome -->
  <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="28" r="6" fill="#27c93f"/>
  <text x="110" y="33" fill="#8b949e" font-size="13" font-family="Segoe UI, Arial">Your coding app — Muse</text>

  <!-- user message -->
  <g filter="url(#s)">
    <rect x="360" y="60" width="370" height="40" rx="10" fill="#21262d"/>
    <text x="710" y="85" text-anchor="end" fill="#e6edf3" font-size="13" font-family="Segoe UI, Arial">count the items on my Desktop, step by step</text>
  </g>

  <!-- thinking block -->
  <text x="30" y="135" fill="#8b949e" font-size="13" font-family="Segoe UI, Arial">▾ Thinking · 6 steps</text>

  <g font-size="12.5">
    <text x="44" y="165" fill="#c9a3ff" font-weight="700">Read the connector instructions</text>
    <text x="44" y="183" fill="#8b949e" font-family="Segoe UI, Arial">Opened CONNECTOR.md to see how to reach the PC. 654 ms, no flags.</text>

    <text x="44" y="215" fill="#c9a3ff" font-weight="700">Listed the available tools</text>
    <text x="44" y="233" fill="#8b949e" font-family="Segoe UI, Arial">run_command is available — PowerShell on the PC. exit 0, 3.1 s.</text>

    <text x="44" y="265" fill="#c9a3ff" font-weight="700">Wrote the path argument</text>
    <text x="44" y="283" fill="#8b949e" font-family="Segoe UI, Arial">Saved { "path": "C:\\Users\\...\\Desktop" } for the list command.</text>

    <text x="44" y="315" fill="#c9a3ff" font-weight="700">Ran list_dir on the Desktop</text>
    <text x="44" y="333" fill="#8b949e" font-family="Segoe UI, Arial">Counted every item in the folder. exit 0.</text>
  </g>

  <!-- divider -->
  <line x1="30" y1="360" x2="730" y2="360" stroke="#30363d" stroke-dasharray="4 4"/>

  <!-- answer -->
  <g filter="url(#s)">
    <rect x="30" y="378" width="700" height="66" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="48" y="406" fill="#e6edf3" font-size="13.5" font-family="Segoe UI, Arial" font-weight="700">Done via your PC connector.</text>
    <text x="48" y="428" fill="#c9d1d9" font-size="13" font-family="Segoe UI, Arial">There are 130 items on your Desktop.</text>
  </g>
</svg>
